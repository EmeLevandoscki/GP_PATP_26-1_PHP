; Aplicado por PHP CGI/FastCGI. Conferir também no painel da hospedagem.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
; Registro do sistema, sem criar arquivos na pasta pública.
; Se o provedor não disponibilizar syslog, substitua pelo caminho ABSOLUTO
; de um arquivo privado fora de public_html, conforme db/SEGURANCA.md.
error_log = syslog
error_log_mode = 0600
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
